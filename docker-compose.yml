# Full stack: postgres, redis, api, worker, web.
# Migrations and the demo seed run once on first boot.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pinpoint
      POSTGRES_PASSWORD: pinpoint
      POSTGRES_DB: pinpoint
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pinpoint -d pinpoint']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npm run db:deploy -w @pinpoint/api &&
             npm run db:seed -w @pinpoint/api &&
             npm run dev -w @pinpoint/api"
    environment:
      NODE_ENV: development
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:5173
      PUBLIC_API_URL: http://localhost:4000
      DATABASE_URL: postgresql://pinpoint:pinpoint@postgres:5432/pinpoint?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-that-is-long-enough-for-hs256}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_DIR: /app/apps/api/storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_PAGES_PER_TOPIC: 2
    ports:
      - '4000:4000'
    volumes:
      - .:/app
      - storage:/app/apps/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npm run dev:worker -w @pinpoint/api"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://pinpoint:pinpoint@postgres:5432/pinpoint?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-that-is-long-enough-for-hs256}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_DIR: /app/apps/api/storage
    volumes:
      - .:/app
      - storage:/app/apps/api/storage
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npm run dev -w @pinpoint/web"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://api:4000
    ports:
      - '5173:5173'
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  storage:
